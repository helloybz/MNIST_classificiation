[tool.poetry]
name = "mnist_classification"
package-mode=false
version = "0.1.0"
description = ""
authors = ["Youngbeom Choi <helloybz@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.12"
poethepoet = "*"
lightning = "^2.5.0.post0"
click = "^8.1.8"
loguru = "^0.7.3"
torchvision = "^0.21.0"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pylint = "*"
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
    [tool.poe.tasks.format]
    help = "Run Ruff foramt"
    cmd  = "ruff format ."

    [tool.poe.tasks.format-check]
    help = "Run Ruff formatter"
    cmd  = "ruff format --check ."

    [tool.poe.tasks.ruff-lint]
    help = "lint check"
    cmd  = "ruff check ./src"

    [tool.poe.tasks.types]
    help = "Run the type checker"
    cmd  = "mypy src --ignore-missing-imports"

    [tool.poe.tasks.lint]
    help = "Run the linter"
    cmd  = "pylint ./src"

    [tool.poe.tasks.test]
    help = "Run unit and feature tests"
    cmd  = "pytest --cov=src tests/ --junitxml=build/xunit-result.xml"

    [tool.poe.tasks.check]
    help     = "Run all checks on the code base"
    sequence = ["format-check", "ruff-lint", "types", "lint", "test"]

    [tool.poe.tasks.web]
    help  = "Run web app on local"
    cmd   = "python src/main.py web run"
    env = {PYTHONPATH="${PYTHONPATH}:/src"}

    [tool.poe.tasks.clean]
    help = "Remove generated files"
    cmd  = """
      rm -rf .coverage
            .mypy_cache
            .pytest_cache
            ./**/__pycache__
    """

[tool.coverage.run]
branch = true
omit = ["*/main.py", "*/command.py"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
incremental = false
plugins = ["pydantic.mypy"]
